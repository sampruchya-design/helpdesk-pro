# Render blueprint — deploy ฟรีจาก GitHub
# 1) push โปรเจคนี้ขึ้น GitHub
# 2) https://render.com → New → Blueprint → เลือก repo
# ⚠️ ข้อจำกัด free tier Render: หลับเมื่อไม่มีคนเข้า 15 นาที และดิสก์ชั่วคราว
#    → ระบบสำรองข้อมูลอัตโนมัติ: ส่ง database.db ไป Telegram ทุก 6 ชม. + หลัง start
#      (ต้องกรอก Telegram Bot Token / Chat ID ในหน้าแอดมิน) + ปุ่ม "สำรองฐานข้อมูล" ในหน้าแอดมิน
services:
  - type: web
    name: helpdeskpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_GROUP_CHAT_ID
        sync: false