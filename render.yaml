# Render blueprint — deploy ฟรีจาก GitHub
# 1) push โปรเจคนี้ขึ้น GitHub
# 2) https://render.com → New → Blueprint → เลือก repo
# ⚠️ ข้อจำกัด free tier Render: หลับเมื่อไม่มีคนเข้า 15 นาที และดิสก์ชั่วคราว
#    → ปุ่ม "สำรองฐานข้อมูล" (admin) ใช้ดาวน์โหลด .db ไว้ก่อน restart ได้
services:
  - type: web
    name: helpdeskpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_GROUP_CHAT_ID
        sync: false